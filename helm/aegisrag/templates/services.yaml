{{- if and .Values.ingress.enabled (not .Values.web.enabled) }}
{{- fail "ingress requires web.enabled" }}
{{- end }}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisrag.fullname" . }}-redis
spec:
  ports: [{port: {{ .Values.redis.service.port }}, targetPort: 6379}]
  selector:
    {{- include "aegisrag.selectorLabels" . | nindent 4 }}
    component: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "aegisrag.fullname" . }}-redis-data
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.global.storageClass }}
  storageClassName: {{ .Values.global.storageClass | quote }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.redis.persistence.size }}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisrag.fullname" . }}-redis
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "aegisrag.selectorLabels" . | nindent 6 }}
      component: redis
  template:
    metadata:
      labels:
        {{- include "aegisrag.selectorLabels" . | nindent 8 }}
        component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          command: ["redis-server", "--appendonly", "yes"]
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            timeoutSeconds: 3
          volumeMounts: [{name: data, mountPath: /data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ include "aegisrag.fullname" . }}-redis-data}
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisrag.fullname" . }}-web
spec:
  ports: [{port: {{ .Values.web.service.port }}, targetPort: 3100}]
  selector:
    {{- include "aegisrag.selectorLabels" . | nindent 4 }}
    component: web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisrag.fullname" . }}-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "aegisrag.selectorLabels" . | nindent 6 }}
      component: web
  template:
    metadata:
      labels:
        {{- include "aegisrag.selectorLabels" . | nindent 8 }}
        component: web
    spec:
      containers:
        - name: web
          image: {{ include "aegisrag.image" (dict "root" . "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          env:
            - name: RAG_API_BASE_URL
              value: {{ printf "http://%s-api:%v" (include "aegisrag.fullname" .) .Values.api.service.port | quote }}
            - {name: NEXT_TELEMETRY_DISABLED, value: "1"}
          ports: [{containerPort: 3100}]
          readinessProbe:
            httpGet: {path: /, port: 3100}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "aegisrag.fullname" . }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "aegisrag.fullname" . }}-web
                port: {number: {{ .Values.web.service.port }}}
{{- end }}
