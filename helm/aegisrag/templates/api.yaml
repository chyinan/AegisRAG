{{- if .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisrag.fullname" . }}-api
  labels:
    {{- include "aegisrag.labels" . | nindent 4 }}
spec:
  ports: [{name: http, port: {{ .Values.api.service.port }}, targetPort: 8000}]
  selector:
    {{- include "aegisrag.selectorLabels" . | nindent 4 }}
    component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisrag.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "aegisrag.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "aegisrag.selectorLabels" . | nindent 8 }}
        component: api
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        {{- include "aegisrag.migrationWait" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "aegisrag.image" (dict "root" . "image" .Values.api.image) | quote }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          envFrom:
            - configMapRef: {name: {{ include "aegisrag.fullname" . }}-app}
          env:
            {{- include "aegisrag.appEnv" . | nindent 12 }}
          ports: [{name: http, containerPort: 8000}]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /ready, port: http}
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            timeoutSeconds: 5
            periodSeconds: 20
          {{- if .Values.api.folderConnectorClaim }}
          volumeMounts:
            - {name: connectors, mountPath: /data/connectors, readOnly: true}
          {{- end }}
      {{- if .Values.api.folderConnectorClaim }}
      volumes:
        - name: connectors
          persistentVolumeClaim: {claimName: {{ .Values.api.folderConnectorClaim | quote }}}
      {{- end }}
{{- end }}
