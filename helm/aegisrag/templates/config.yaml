apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisrag.fullname" . }}-app
  labels:
    {{- include "aegisrag.labels" . | nindent 4 }}
data:
  {{- range $name, $value := .Values.api.env }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  MINIO_ENDPOINT: {{ if .Values.minio.enabled }}{{ printf "http://%s-minio:%v" (include "aegisrag.fullname" .) .Values.minio.service.apiPort | quote }}{{ else }}{{ required "minio.endpoint is required for external object storage" .Values.minio.endpoint | quote }}{{ end }}
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  {{- if .Values.observability.jaeger.enabled }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ printf "http://%s-jaeger:%v" (include "aegisrag.fullname" .) .Values.observability.jaeger.service.otlpGrpcPort | quote }}
  {{- end }}
