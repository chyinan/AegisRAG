{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisrag.secretName" . }}
  labels:
    {{- include "aegisrag.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ required "secrets.postgresBootstrapPassword is required" .Values.secrets.postgresBootstrapPassword | quote }}
  postgres-migration-password: {{ required "secrets.postgresMigrationPassword is required" .Values.secrets.postgresMigrationPassword | quote }}
  postgres-runtime-password: {{ required "secrets.postgresRuntimePassword is required" .Values.secrets.postgresRuntimePassword | quote }}
  database-url: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:%v/%s" .Values.postgres.auth.runtimeUsername (.Values.secrets.postgresRuntimePassword | urlquery | replace "+" "%20") (include "aegisrag.fullname" .) .Values.postgres.service.port .Values.postgres.auth.database | quote }}
  migration-database-url: {{ printf "postgresql+asyncpg://%s:%s@%s-postgres:%v/%s" .Values.postgres.auth.migrationUsername (.Values.secrets.postgresMigrationPassword | urlquery | replace "+" "%20") (include "aegisrag.fullname" .) .Values.postgres.service.port .Values.postgres.auth.database | quote }}
  {{- else }}
  database-url: {{ required "secrets.runtimeDatabaseUrl is required for external PostgreSQL" .Values.secrets.runtimeDatabaseUrl | quote }}
  migration-database-url: {{ required "secrets.migrationDatabaseUrl is required for external PostgreSQL" .Values.secrets.migrationDatabaseUrl | quote }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-url: {{ printf "redis://%s-redis:%v/0" (include "aegisrag.fullname" .) .Values.redis.service.port | quote }}
  {{- else }}
  redis-url: {{ required "secrets.redisUrl is required for external Redis" .Values.secrets.redisUrl | quote }}
  {{- end }}
  minio-access-key: {{ required "secrets.minioAccessKey is required" .Values.secrets.minioAccessKey | quote }}
  minio-secret-key: {{ required "secrets.minioSecretKey is required" .Values.secrets.minioSecretKey | quote }}
  jwt-secret: {{ required "secrets.jwtSecret is required" .Values.secrets.jwtSecret | quote }}
  folder-cursor-secret: {{ required "secrets.folderCursorSecret is required" .Values.secrets.folderCursorSecret | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | quote }}
  embedding-api-key: {{ .Values.secrets.embeddingApiKey | quote }}
  {{- if .Values.observability.grafana.enabled }}
  grafana-admin-password: {{ required "secrets.grafanaAdminPassword is required when Grafana is enabled" .Values.secrets.grafanaAdminPassword | quote }}
  {{- end }}
{{- end }}
