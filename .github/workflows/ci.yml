name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest tests/unit --cov --cov-report=xml

      - name: Integration mock tests
        run: uv run pytest tests/integration --cov --cov-append --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: RAG eval smoke gate
        run: >
          uv run python -m tests.eval.rag.run_ci_smoke
          --dataset tests/eval/datasets/rag_smoke.json
          --config tests/eval/config/rag_smoke_gate.json
          --report-dir tests/eval/reports

      - name: RAG eval extended gate
        run: >
          uv run python -m tests.eval.rag.run_ci_smoke
          --extended
          --config tests/eval/config/rag_extended_gate.json
          --report-dir tests/eval/reports

      - name: Install optional framework adapters
        run: uv sync --dev --frozen --extra langchain --extra langgraph

      - name: Optional framework contracts
        run: >
          uv run --frozen --extra langchain --extra langgraph pytest
          tests/unit/llm/test_langchain_provider.py
          tests/unit/embeddings/test_langchain_provider.py
          tests/unit/agent/test_runtime_backend_contract.py
          tests/unit/test_framework_configuration.py
          tests/unit/test_langchain_optional_dependencies.py
          --no-cov

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-eval-smoke-reports
          path: tests/eval/reports/*.json
          if-no-files-found: ignore
          retention-days: 7

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build

  build-and-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, web, worker]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.${{ matrix.image }}
          push: true
          tags: |
            ghcr.io/chyinan/aegisrag-${{ matrix.image }}:latest
            ghcr.io/chyinan/aegisrag-${{ matrix.image }}:${{ github.sha }}
