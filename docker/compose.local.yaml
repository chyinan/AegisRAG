# Simplified AegisRAG - Without MinIO (uses local file system instead)
name: aegisrag-local

# Core services only (no optional monitoring services by default)
services:
  # === PostgreSQL Database ===
  postgres:
    image: "pgvector/pgvector:pg17"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AegisRAG_Local_Database_Secure!@#%}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # === PostgreSQL Roles Setup ===
  postgres-roles:
    image: pgvector/pgvector:pg17
    entrypoint: ["/bin/sh", "-ec"]
    command: ["/roles/init-roles.sh"]
    environment:
      DB_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-rag_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-rag_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-rag_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - ./postgres/init-roles.sh:/roles/init-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # === Redis for caching & queues ===
  redis:
    image: "docker.io/library/redis:7.4-alpine"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # === Database Migration ===
  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DEV_AUTH_HEADERS: ${ENABLE_DEV_AUTH_HEADERS:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_MIGRATION_USER:-rag_migrator}:${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rag_app}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENABLED: "false"
      LOCAL_FILE_STORAGE_ROOT: /ingested-documents
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIM: 768
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_API_KEY: ollama
      VECTOR_INDEX_DIM: 768
      VECTOR_STORE_TYPE: pgvector
      PGVECTOR_INDEX_TYPE: hnsw
      PGVECTOR_HNSW_M: 16
      PGVECTOR_HNSW_EF_CONSTRUCTION: 64
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
    restart: "no"

  # === API Service (FastAPI Backend) ===
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DEV_AUTH_HEADERS: ${ENABLE_DEV_AUTH_HEADERS:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:-rag_runtime}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rag_app}
      REDIS_URL: redis://redis:6379/0
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
      INGESTION_QUEUE_NAME: ingestion
      WORKER_QUEUE_NAME: ingestion
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIM: 768
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_API_KEY: ollama
      VECTOR_INDEX_DIM: 768
      VECTOR_STORE_TYPE: pgvector
      PGVECTOR_INDEX_TYPE: hnsw
      PGVECTOR_HNSW_M: 16
      PGVECTOR_HNSW_EF_CONSTRUCTION: 64
      READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:9b}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      RERANK_PROVIDER: fake
      MINIO_ENABLED: "false"
      LOCAL_FILE_STORAGE_ROOT: /ingested-documents
    volumes:
      - ./${FOLDER_CONNECTOR_HOST_PATH:-./connector-data}:/data/connectors:ro
      - ingested-documents:/ingested-documents
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # === Frontend (Next.js Web UI) ===
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    environment:
      RAG_API_BASE_URL: ${RAG_API_BASE_URL:-http://api:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_PORT:-3100}:3100"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # === Ingestion Worker (PDF, DOCX, etc. processing) ===
  worker-ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DEV_AUTH_HEADERS: ${ENABLE_DEV_AUTH_HEADERS:-false}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:-rag_runtime}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rag_app}
      REDIS_URL: redis://redis:6379/0
      INGESTION_QUEUE_NAME: ingestion
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIM: 768
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_API_KEY: ollama
      RERANK_PROVIDER: fake
      OCR_PROVIDER: tesseract
      MINIO_ENABLED: "false"
      LOCAL_FILE_STORAGE_ROOT: /ingested-documents
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - ingested-documents:/ingested-documents
    restart: unless-stopped

  # === Embedding Worker (Vector computation) ===
  worker-embedding:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:-rag_runtime}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rag_app}
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_PROVIDER: ollama
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_DIM: 768
      EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
      EMBEDDING_API_KEY: ollama
      VECTOR_INDEX_DIM: 768
      VECTOR_STORE_TYPE: pgvector
      INGESTION_QUEUE_NAME: embedding
      WORKER_QUEUE_NAME: embedding
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ingested-documents:

# === Optional monitoring services (add them back if needed) ===