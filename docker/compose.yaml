# From the repository root, load interpolation explicitly:
# docker compose --env-file .env -f docker/compose.yaml up --build
name: aegisrag

x-api-environment: &api-environment
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  ENABLE_DEV_AUTH_HEADERS: ${ENABLE_DEV_AUTH_HEADERS:-false}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER:-rag_runtime}:${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rag_app}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  LLM_MAX_IN_FLIGHT: ${LLM_MAX_IN_FLIGHT:-8}
  LLM_MAX_WAITERS: ${LLM_MAX_WAITERS:-32}
  LLM_QUEUE_TIMEOUT_SECONDS: ${LLM_QUEUE_TIMEOUT_SECONDS:-2}
  LLM_TOTAL_TIMEOUT_SECONDS: ${LLM_TOTAL_TIMEOUT_SECONDS:-45}
  EMBEDDING_MAX_IN_FLIGHT: ${EMBEDDING_MAX_IN_FLIGHT:-8}
  EMBEDDING_MAX_WAITERS: ${EMBEDDING_MAX_WAITERS:-32}
  EMBEDDING_QUEUE_TIMEOUT_SECONDS: ${EMBEDDING_QUEUE_TIMEOUT_SECONDS:-2}
  EMBEDDING_TOTAL_TIMEOUT_SECONDS: ${EMBEDDING_TOTAL_TIMEOUT_SECONDS:-45}
  PROVIDER_RETRY_BACKOFF_SECONDS: ${PROVIDER_RETRY_BACKOFF_SECONDS:-0.1}
  PROVIDER_RETRY_MAX_BACKOFF_SECONDS: ${PROVIDER_RETRY_MAX_BACKOFF_SECONDS:-2}
  BGE_MAX_CONCURRENCY: ${BGE_MAX_CONCURRENCY:-1}
  BGE_MAX_QUEUE_SIZE: ${BGE_MAX_QUEUE_SIZE:-32}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
  MINIO_BUCKET: ${MINIO_BUCKET:-documents}
  MINIO_DOCUMENT_PREFIX: ${MINIO_DOCUMENT_PREFIX:-raw-documents}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-26214400}
  INGESTION_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-ingestion}
  EMBEDDING_ADAPTER: ${EMBEDDING_ADAPTER:-native}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake-embedding}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-8}
  EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_PROVIDER_VERSION: ${EMBEDDING_PROVIDER_VERSION:-}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-10}
  EMBEDDING_RETRY_BUDGET: ${EMBEDDING_RETRY_BUDGET:-2}
  EMBEDDING_QUEUE_NAME: ${EMBEDDING_QUEUE_NAME:-embedding}
  VECTOR_STORE_TYPE: ${VECTOR_STORE_TYPE:-pgvector}
  VECTOR_INDEX_DIM: ${VECTOR_INDEX_DIM:-8}
  VECTOR_DISTANCE_METRIC: ${VECTOR_DISTANCE_METRIC:-cosine}
  PGVECTOR_INDEX_TYPE: ${PGVECTOR_INDEX_TYPE:-hnsw}
  PGVECTOR_HNSW_M: ${PGVECTOR_HNSW_M:-16}
  PGVECTOR_HNSW_EF_CONSTRUCTION: ${PGVECTOR_HNSW_EF_CONSTRUCTION:-64}
  READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ISSUER: ${JWT_ISSUER:-}
  JWT_AUDIENCE: ${JWT_AUDIENCE:-}
  JWT_REQUIRE_LOCAL_SESSION: ${JWT_REQUIRE_LOCAL_SESSION:-true}
  JWT_JWKS_URL: ${JWT_JWKS_URL:-}
  JWT_JWKS_ALGORITHMS: ${JWT_JWKS_ALGORITHMS:-RS256}
  JWT_JWKS_CACHE_SECONDS: ${JWT_JWKS_CACHE_SECONDS:-300}
  JWT_OIDC_TIMEOUT_SECONDS: ${JWT_OIDC_TIMEOUT_SECONDS:-2}
  OPENWEBUI_SERVICE_TOKEN_HASHES_JSON: ${OPENWEBUI_SERVICE_TOKEN_HASHES_JSON:-[]}
  LLM_ADAPTER: ${LLM_ADAPTER:-native}
  AGENT_ORCHESTRATION_BACKEND: ${AGENT_ORCHESTRATION_BACKEND:-native}
  AGENT_DECISION_MODE: ${AGENT_DECISION_MODE:-json}
  AGENT_DURABLE_ENABLED: ${AGENT_DURABLE_ENABLED:-false}
  AGENT_DURABLE_BACKGROUND_ENABLED: ${AGENT_DURABLE_BACKGROUND_ENABLED:-false}
  SUPPORT_TICKET_ENABLED: ${SUPPORT_TICKET_ENABLED:-false}
  FOLDER_SYNC_ENABLED: ${FOLDER_SYNC_ENABLED:-false}
  FOLDER_SYNC_BATCH_TIMEOUT_SECONDS: ${FOLDER_SYNC_BATCH_TIMEOUT_SECONDS:-120}
  FOLDER_SYNC_MAX_MANAGED_SOURCES: ${FOLDER_SYNC_MAX_MANAGED_SOURCES:-10000}
  COST_ACCOUNTING_ENABLED: ${COST_ACCOUNTING_ENABLED:-false}
  COST_CURRENCY: ${COST_CURRENCY:-USD}
  COST_MODEL_PRICES_JSON: ${COST_MODEL_PRICES_JSON:-}
  COST_MONTHLY_BUDGET: ${COST_MONTHLY_BUDGET:-}
  COST_MINIMUM_RESERVATION: ${COST_MINIMUM_RESERVATION:-}
  COST_IO_TIMEOUT_SECONDS: ${COST_IO_TIMEOUT_SECONDS:-5}
  AGENT_DURABLE_RETENTION_SECONDS: ${AGENT_DURABLE_RETENTION_SECONDS:-86400}
  AGENT_DURABLE_LEASE_SECONDS: ${AGENT_DURABLE_LEASE_SECONDS:-30}
  AGENT_DEFAULT_MAX_STEPS: ${AGENT_DEFAULT_MAX_STEPS:-8}
  AGENT_DEFAULT_MAX_TOOL_CALLS: ${AGENT_DEFAULT_MAX_TOOL_CALLS:-5}
  AGENT_DEFAULT_TIMEOUT_SECONDS: ${AGENT_DEFAULT_TIMEOUT_SECONDS:-30}
  AGENT_PERSISTENCE_PHASE_TIMEOUT_SECONDS: ${AGENT_PERSISTENCE_PHASE_TIMEOUT_SECONDS:-5}
  AGENT_AUXILIARY_IO_TIMEOUT_SECONDS: ${AGENT_AUXILIARY_IO_TIMEOUT_SECONDS:-1}
  RAG_AUXILIARY_IO_TIMEOUT_SECONDS: ${RAG_AUXILIARY_IO_TIMEOUT_SECONDS:-1}
  AGENT_REPEATED_ACTION_THRESHOLD: ${AGENT_REPEATED_ACTION_THRESHOLD:-3}
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  LLM_MODEL: ${LLM_MODEL:-fake-llm}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10}
  LLM_RETRY_BUDGET: ${LLM_RETRY_BUDGET:-2}
  LLM_FAKE_RESPONSE_TEXT: ${LLM_FAKE_RESPONSE_TEXT:-Fake LLM response.}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-}
  LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
  LLM_PROVIDER_VERSION: ${LLM_PROVIDER_VERSION:-}
  RERANK_PROVIDER: ${RERANK_PROVIDER:-fake}
  RERANK_MODEL: ${RERANK_MODEL:-deepseek-v4-flash}
  MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
  MILVUS_TOKEN: ${MILVUS_TOKEN:-}
  MILVUS_INDEX_TYPE: ${MILVUS_INDEX_TYPE:-HNSW}
  GRAPH_RAG_ENABLED: ${GRAPH_RAG_ENABLED:-false}
  GRAPH_RAG_MODEL: ${GRAPH_RAG_MODEL:-deepseek-v4-flash}
  GRAPH_RAG_MAX_HOPS: ${GRAPH_RAG_MAX_HOPS:-2}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-aegisrag-api}
  RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10000}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60.0}
  RATE_LIMIT_BACKEND_TIMEOUT_SECONDS: ${RATE_LIMIT_BACKEND_TIMEOUT_SECONDS:-1.0}
  HYBRID_DEGRADED_MODE: ${HYBRID_DEGRADED_MODE:-true}
  HYBRID_PARALLEL_ENABLED: ${HYBRID_PARALLEL_ENABLED:-true}
  QUEUE_JOB_TIMEOUT_SECONDS: ${QUEUE_JOB_TIMEOUT_SECONDS:-900}
  QUEUE_RETRY_MAX: ${QUEUE_RETRY_MAX:-3}
  QUEUE_IDEMPOTENCY_TTL_SECONDS: ${QUEUE_IDEMPOTENCY_TTL_SECONDS:-86400}
  QUEUE_IDEMPOTENCY_LOCK_TTL_SECONDS: ${QUEUE_IDEMPOTENCY_LOCK_TTL_SECONDS:-300}
  FOLDER_CONNECTOR_ROOT: ${FOLDER_CONNECTOR_ROOT:-/data/connectors}
  FOLDER_CURSOR_SECRET: ${FOLDER_CURSOR_SECRET:?FOLDER_CURSOR_SECRET is required}

services:
  postgres:
    image: "ghcr.io/astral-sh/pgvector:pg17"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AegisRAG_Secure_2024!@#%}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: "docker.io/library/redis:7.4-alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: quay.io/minio/mc:latest
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-documents}
    command:
      - "mc alias set local \"$${MINIO_ENDPOINT}\" \"$${MINIO_ACCESS_KEY}\" \"$${MINIO_SECRET_KEY}\" && mc mb --ignore-existing \"local/$${MINIO_BUCKET}\""
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  postgres-roles:
    image: pgvector/pgvector:pg17
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until pg_isready -h "postgres" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do sleep 1; done
      psql -h "postgres" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
        -c "CREATE ROLE IF NOT EXISTS rag_migrator LOGIN PASSWORD '$${POSTGRES_MIGRATION_PASSWORD}';" \
        -c "CREATE ROLE IF NOT EXISTS rag_runtime LOGIN PASSWORD '$${POSTGRES_RUNTIME_PASSWORD}';"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-rag_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-rag_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - ./postgres/ensure-roles.sql:/Dockerfile.ensure-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      <<: *api-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_MIGRATION_USER:-rag_migrator}:${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rag_app}

  # Explicit one-shot operation; never creates accounts on normal startup.
  bootstrap:
    profiles: ["bootstrap"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    entrypoint: ["uv", "run", "--no-sync", "python", "-m", "packages.auth.bootstrap_cli"]
    command: ["--help"]
    environment:
      <<: *api-environment
    depends_on:
      migration:
        condition: service_completed_successfully
    stdin_open: true
    tty: true
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      <<: *api-environment
      LOCAL_FILE_STORAGE_ROOT: /ingested-documents
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3100:3100"

  worker-ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *api-environment
      WORKER_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-ingestion}
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-960s}
    restart: unless-stopped

  worker-embedding:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *api-environment
      WORKER_QUEUE_NAME: ${EMBEDDING_QUEUE_NAME:-embedding}
    depends_on:
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-960s}
    restart: unless-stopped

  # Explicit opt-in services; normal startup never schedules these workflows.
  worker-folder-sync:
    profiles: ["folder-sync"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["uv", "run", "--no-sync", "python", "-m", "apps.worker.folder_sync"]
    # The scheduler only accepts HTTPS or loopback HTTP. Share the API namespace
    # to use loopback without weakening that contract.
    network_mode: "service:api"
    environment:
      FOLDER_SYNC_API_URL: http://127.0.0.1:8000
      FOLDER_SYNC_BEARER_TOKEN: ${FOLDER_SYNC_BEARER_TOKEN:-}
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 360s
    restart: "no"

  worker-durable:
    profiles: ["durable-agent"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["uv", "run", "--no-sync", "python", "-m", "apps.worker.durable_agent", "--factory", "${AGENT_DURABLE_WORKER_FACTORY:-}"]
    environment:
      <<: *api-environment
    depends_on:
      migration:
        condition: service_completed_successfully
    stop_grace_period: ${WORKER_STOP_GRACE_PERIOD:-960s}
    restart: "no"

  queue-metrics:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    command: ["uv", "run", "--no-sync", "python", "-m", "apps.worker.queue_metrics"]
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      INGESTION_QUEUE_NAME: ${INGESTION_QUEUE_NAME:-ingestion}
      EMBEDDING_QUEUE_NAME: ${EMBEDDING_QUEUE_NAME:-embedding}
    expose: ["9181"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Used only by the explicit offline snapshot CLI. Never starts a database.
  backup-helper:
    profiles: ["operations"]
    image: pgvector/pgvector:pg17
    entrypoint: ["tar"]
    command: ["--help"]
    network_mode: none
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.2.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3101}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  # --- OpenTelemetry Collector + Jaeger (distributed tracing) ---
  jaeger:
    image: jaegertracing/all-in-one:1.62
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"    # Jaeger UI
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"  # OTLP gRPC
    restart: unless-stopped

  # --- Milvus vector database (enterprise scale) ---
  # Activated with profile: docker compose --profile milvus up
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    profiles: ["milvus"]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.0
    profiles: ["milvus"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY is required}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_GRPC_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    command:
      - milvus
      - run
      - standalone
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  grafana-data:
  etcd-data:
  milvus-data:
