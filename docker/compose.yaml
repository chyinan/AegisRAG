name: aegisrag-local

services:
  postgres:
    image: "ghcr.io/astral-sh/pgvector:pg17"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AegisRAG_Secure_2024!@#%}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: "docker.io/library/redis:7.4-alpine"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres-roles:
    image: pgvector/pgvector:pg17
    entrypoint: ["/bin/sh", "-c"]
    command: |
      until pg_isready -h "postgres" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do sleep 1; done
      psql -h "postgres" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" \
        -c "CREATE ROLE IF NOT EXISTS rag_migrator LOGIN PASSWORD '$${POSTGRES_MIGRATION_PASSWORD}';" \
        -c "CREATE ROLE IF NOT EXISTS rag_runtime LOGIN PASSWORD '$${POSTGRES_RUNTIME_PASSWORD}';"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rag_app}
      POSTGRES_MIGRATION_USER: ${POSTGRES_MIGRATION_USER:-rag_migrator}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:-rag_runtime}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - ./postgres/ensure-roles.sql:/Dockerfile.ensure-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  migration:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rag_bootstrap}:${POSTGRES_PASSWORD:-AegisRAG_Secure_2024!@#%}@postgres:5432/rag_app

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      MINIO_ENABLED: "false"
      LOCAL_FILE_STORAGE_ROOT: /ingested-documents
    ports:
      - "8000:8000"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    ports:
      - "3100:3100"

  worker-ingestion:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker

  worker-embedding:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker

volumes:
  postgres-data:
  redis-data:
